<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenya CRM → MS Booking</title>
    <!-- Page déposée à la bascule (lot 6) à la place de index.html du dépôt vsq31/scenya-crm (GitHub Pages).
         Elle redirige vers MS Booking en conservant l'ancienne adresse (#/lieu/12, #/annuaire?q=…),
         que l'application réécrit ensuite en chemin réel. Remplacer DOMAINE par le domaine définitif. -->
    <meta name="robots" content="noindex" />
    <script>
      var cible = 'https://ms-booking-puce.vercel.app/' + (location.hash || '');
      location.replace(cible);
    </script>
    <style>
      body {
        font-family:
          'Work Sans',
          -apple-system,
          sans-serif;
        background: #faf6f0;
        color: #2b2621;
        padding: 12vh 20px;
        text-align: center;
      }
      a {
        color: #2b2621;
      }
    </style>
  </head>
  <body>
    <h1>Scenya CRM est devenu MS Booking</h1>
    <p>
      Si la page ne s'ouvre pas toute seule :
      <a id="lien" href="https://ms-booking-puce.vercel.app/">ouvrir MS Booking</a> et mettre à jour
      vos favoris.
    </p>
    <script>
      document.getElementById('lien').href = cible;
    </script>
  </body>
</html>
